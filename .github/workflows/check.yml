- name: Änderungen an sent_codes.txt speichern
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [ -f sent_codes.txt ]; then
            git add sent_codes.txt
            git diff --staged --quiet || git commit -m "Update sent codes"
            git push
          else
            echo "sent_codes.txt existiert noch nicht – nichts zu committen."
          fi
